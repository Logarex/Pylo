name: Vérifications Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
      - name: Compiler l’application iOS
        run: xcodebuild -project Pylo.xcodeproj -scheme Pylo -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
